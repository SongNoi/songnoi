# SongNoi — one command self-host:  cp .env.example .env  (set the secrets)  &&  docker compose up
name: songnoi

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: songnoi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: songnoi
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      # Bound to localhost only, for `pnpm dev` and tests on this machine.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U songnoi -d songnoi"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: songnoi/web:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://songnoi:${POSTGRES_PASSWORD}@postgres:5432/songnoi
      ADMIN_AUTH_SECRET: ${ADMIN_AUTH_SECRET:?set ADMIN_AUTH_SECRET in .env}
      RESPONDENT_AUTH_SECRET: ${RESPONDENT_AUTH_SECRET:?set RESPONDENT_AUTH_SECRET in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NEXT_TELEMETRY_DISABLED: "1"
      CHECKPOINT_DISABLE: "1"
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  postgres-data:
